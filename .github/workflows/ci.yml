name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: pip install coverage

      # GUI を起動せずにバイトコードコンパイルだけ行う（tkinter 不要）
      - name: Compile check
        run: |
          python -m py_compile wslmgr.py wsl_core.py wslmgr_cli.py
          python -m compileall -q wsl_core wslmgr_gui

      # 純粋ロジック (wsl_core) / CLI の単体テストとカバレッジ計測
      - name: Unit tests & coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m

      # Windows ランナーは tkinter / winreg が利用可能なため、
      # GUI モジュールの import スモークテストまで実施できる
      # (main() は __name__ ガードで実行されない)
      - name: Import smoke test (wslmgr)
        if: runner.os == 'Windows'
        run: python -c "import wslmgr; print('import OK')"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff のバージョンを固定し、新しいルール追加による突然の CI 失敗を防ぐ。
      # 更新する場合は意図的にバージョンを上げること。
      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Ruff check
        run: ruff check .

      # mypy もバージョンを固定する。対象は pyproject.toml の [tool.mypy] を参照。
      - name: Install mypy
        run: pip install mypy==2.3.1

      - name: Type check (mypy)
        run: mypy

  build:
    name: Build Executable (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean WSLManager.spec

      - name: Verify executable artifact
        run: |
          if (-not (Test-Path "dist\WSLManager.exe")) {
            Write-Error "dist\WSLManager.exe was not created"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSLManager-exe
          path: dist/WSLManager.exe

      # コマンドライン用 exe (console 付き)。GUI とは別の spec で、pyinstaller_hooks/ は使わない
      - name: Build CLI with PyInstaller
        run: pyinstaller --clean WSLManagerCLI.spec

      - name: Verify CLI executable artifact
        run: |
          if (-not (Test-Path "dist\wslmgr.exe")) {
            Write-Error "dist\wslmgr.exe was not created"
            exit 1
          }
          $expected = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # 出力が複数行でも文字列として判定する (配列のままだと -notmatch の結果がずれる)
          $out = (& dist\wslmgr.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            Write-Error "wslmgr.exe --version exited with $LASTEXITCODE"
            exit 1
          }
          Write-Host $out
          if ($out -notmatch [regex]::Escape($expected)) {
            Write-Error "wslmgr.exe reports '$out' but pyproject.toml says $expected"
            exit 1
          }
          # argparse の引数エラーは終了コード 2。終了コードが伝播することを確認する
          & dist\wslmgr.exe nosuchcommand 2>$null
          if ($LASTEXITCODE -ne 2) {
            Write-Error "expected exit code 2 for an invalid command, got $LASTEXITCODE"
            exit 1
          }

      - name: Upload CLI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wslmgr-cli-exe
          path: dist/wslmgr.exe

  release:
    name: GitHub Release
    needs: [test, lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: WSLManager-exe
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WSLManager.exe
          generate_release_notes: true

