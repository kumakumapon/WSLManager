name: 機能リクエスト (Feature Request)
description: 新機能や改善の提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能や改善のご提案ありがとうございます。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / 背景
      description: どのような状況で不便や困りごとが生じていますか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能・変更内容
      description: どのような機能や動作を希望されるか具体的に記述してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案 (あれば)
      description: 他に検討された方法や回避策があれば記述してください。
